name: Android CI - Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan menjalankan workflow secara manual
name: Android CI - Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan menjalankan workflow secara manual

jobs:
  build:
    runs-on: ubuntu-latest

    # Indentasi diperbaiki (4 spasi) agar berada di dalam job 'build'
    defaults:
      run:
        working-directory: ./passend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Mengarahkan Gradle cache ke subfolder proyek Anda
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: passenD-debug-apk
          # Path upload artifact tidak terpengaruh defaults, jadi harus menyertakan 'passend/'
          path: passend/app/build/outputs/apk/debug/*.apk

jobs:
  build:
    runs-on: ubuntu-latest
    
defaults:
      run:
        working-directory: ./passend
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: passenD-debug-apk
        path: app/build/outputs/apk/debug/*.apk
