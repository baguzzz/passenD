name: Android CI - Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find or Generate Gradlew & Build APK
        run: |
          echo "Mencari file gradlew di repositori..."
          GRADLEW_FILE=$(find . -maxdepth 4 -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            echo "Ditemukan di: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "File gradlew tidak ditemukan. Mencari file build.gradle..."
            BUILD_FILE=$(find . -maxdepth 4 -name "settings.gradle*" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
              echo "Folder proyek ditemukan di: $PROJECT_DIR. Membuat Gradle Wrapper..."
              cd "$PROJECT_DIR"
              gradle wrapper
              chmod +x gradlew
              ./gradlew assembleDebug --stacktrace
            else
              echo "ERROR: Proyek Gradle/Android tidak ditemukan! Isi repositori saat ini:"
              find . -maxdepth 3
              exit 1
            fi
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: passenD-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
